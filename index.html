<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natural Clau's · Pedidos</title>
<style>
  :root { --verde:#145b37; --verde2:#305b13; --crema:#f9f7ef; --suave:#e7f1da; --borde:#d3d7cc; --rojo:#b00020; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--crema); color:#1e2a1e; padding-bottom:96px; }
  header { display:flex; align-items:center; gap:12px; padding:14px 16px; background:#fff; border-bottom:3px solid var(--verde); }
  header img { width:64px; height:64px; border-radius:50%; }
  header h1 { margin:0; font-size:21px; color:var(--verde); }
  header p { margin:2px 0 0; font-size:13px; color:#555; }
  main { max-width:720px; margin:0 auto; padding:12px 12px 0; }
  #search { width:100%; padding:12px 14px; font-size:16px; border:1px solid var(--borde); border-radius:12px; background:#fff; }
  .muted { color:#667; font-size:12px; margin:8px 2px; }
  .card { background:#fff; border:1px solid var(--borde); border-radius:14px; padding:12px; margin:10px 0; }
  .card h2 { margin:0 0 2px; font-size:17px; color:var(--verde); }
  .prices { font-size:13px; color:#444; margin-bottom:8px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips button, .mini { background:var(--suave); color:var(--verde); border:1px solid #bed3b1; border-radius:10px; padding:9px 0; flex:1 1 0; min-width:56px; font-size:14px; font-weight:600; cursor:pointer; }
  .other { display:flex; gap:6px; margin-top:8px; }
  .other input { flex:1; min-width:0; padding:9px 10px; font-size:15px; border:1px solid var(--borde); border-radius:10px; }
  .other button { padding:9px 14px; border-radius:10px; border:1px solid var(--verde); background:#fff; color:var(--verde); font-weight:600; font-size:14px; }
  .incart { display:none; margin-top:8px; padding:8px 10px; background:var(--suave); border-radius:10px; font-size:14px; }
  .incart b { color:var(--verde2); }
  .incart .acts { margin-top:6px; display:flex; gap:6px; }
  .incart .acts button { border:1px solid #9bbd8a; background:#fff; border-radius:8px; padding:6px 10px; font-size:13px; color:var(--verde); }
  .incart .acts button.rm { color:var(--rojo); border-color:var(--rojo); }
  #bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:2px solid var(--verde); padding:10px 12px; display:flex; align-items:center; gap:10px; }
  #summary { flex:1; font-size:14px; font-weight:600; color:var(--verde); }
  #send { background:#25d366; color:#06361b; border:0; border-radius:12px; padding:13px 14px; font-size:15px; font-weight:700; }
  #send:disabled { background:#cfd8cf; color:#789; }
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center; z-index:10; }
  #overlay.open { display:flex; }
  #form { background:#fff; width:100%; max-width:560px; border-radius:18px 18px 0 0; padding:16px; max-height:92vh; overflow:auto; }
  #form h3 { margin:0 0 10px; color:var(--verde); }
  #form label { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; }
  #form input, #form select, #form textarea { width:100%; padding:11px; font-size:16px; border:1px solid var(--borde); border-radius:10px; font-family:inherit; }
  #form .row { display:flex; gap:8px; margin-top:14px; }
  #form .row button { flex:1; padding:13px; border-radius:12px; font-size:16px; font-weight:700; border:0; }
  #cancel { background:#e8e8e8; color:#333; }
  #go { background:#25d366; color:#06361b; }
  .total { margin-top:10px; font-weight:700; color:var(--verde); }
  #toast { position:fixed; left:50%; bottom:92px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 14px; border-radius:10px; font-size:14px; display:none; z-index:20; max-width:90%; text-align:center; }
  .empty { text-align:center; color:#667; padding:30px 10px; }
  .paybox { margin-top:12px; padding:10px 12px; background:var(--suave); border-radius:12px; font-size:14px; }
  .paybox .aliasrow { display:flex; gap:8px; align-items:center; margin-top:6px; }
  .paybox code { flex:1; background:#fff; border:1px solid var(--borde); border-radius:8px; padding:9px 10px; font-size:15px; word-break:break-all; }
  .paybox button { border:1px solid var(--verde); background:#fff; color:var(--verde); border-radius:10px; padding:9px 12px; font-weight:700; font-size:14px; }
  .paybox a { display:inline-block; margin-top:8px; color:var(--verde); font-weight:700; }
</style>
</head>

<script>
const DATA = {"shop":"Natural Clau's","whatsapp":"5492317512425","alias":"naturalclaus.mp","payLink":"","updated":"13/11/2026 08:55","products":[{"id":4,"name":"Almendra guara mediana","kg":40700.00,"p500":20350.00,"p100":4400.00,"max":2000},{"id":5,"name":"Almendra Laminada","kg":35200.00,"p500":17600.00,"p100":3800.00,"max":2000},{"id":6,"name":"Almohadillas Chocolate","kg":10400.00,"p500":5200.00,"p100":1100.00,"max":2000},{"id":7,"name":"Almohadillas Frutilla","kg":10400.00,"p500":5200.00,"p100":1100.00,"max":2000},{"id":8,"name":"Almohadillas limon","kg":10400.00,"p500":5200.00,"p100":1100.00,"max":2000},{"id":9,"name":"Anana en cubos- colores","kg":13700.00,"p500":6850.00,"p100":1550.00,"max":2000},{"id":10,"name":"Arandanos rojos (Chile)","kg":33120.00,"p500":16560.00,"p100":3600.00,"max":3000},{"id":11,"name":"Aritos frutales","kg":7200.00,"p500":3600.00,"p100":1000.00,"max":3000},{"id":12,"name":"Bastoncitos de salvado","kg":6600.00,"p500":3300.00,"p100":800.00,"max":2000},{"id":13,"name":"Castañas caju crudas (Brasil)","kg":27200.00,"p500":13600.00,"p100":3000.00,"max":2000},{"id":14,"name":"Castañas caju tostadas","kg":30320.00,"p500":15160.00,"p100":3300.00,"max":1850},{"id":15,"name":"Castañas de Caju Tostadas y saladas","kg":30320.00,"p500":15160.00,"p100":3300.00,"max":2000},{"id":16,"name":"Chip Banana","kg":20200.00,"p500":10100.00,"p100":2300.00,"max":2000},{"id":2,"name":"Pasas de uva","kg":12800.00,"p500":6400.00,"p100":1408.00,"max":6950},{"id":36,"name":"Semilla girasol","kg":6800.00,"p500":3400.00,"p100":800.00,"max":900}]};
(function () {
  'use strict';
  var products = DATA.products || [];
  var KEY = 'nc_cart_v1', PKEY = 'nc_person_v1';
  var cart = {};
  var fmt = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' });
  function money(v) { return fmt.format(v); }
  function qty(g) { return g >= 1000 ? (g / 1000).toLocaleString('es-AR', { maximumFractionDigits: 3 }) + ' kg' : g + ' g'; }
  function $(id) { return document.getElementById(id); }
  var byId = {};
  products.forEach(function (p) { byId[p.id] = p; });

  // Mismo cálculo que la app: kilos completos al precio por kg; el resto con 500 g + bloques de 100 g,
  // y lo que sobre proporcional al precio de 100 g, con tope en el escalón siguiente.
  function quote(p, grams) {
    if (grams <= 0) return 0;
    var kilos = Math.floor(grams / 1000), rest = grams % 1000, total = kilos * p.kg;
    if (rest > 0) {
      var left = rest, sum = 0;
      if (left >= 500) { sum += p.p500; left -= 500; }
      var hundreds = Math.floor(left / 100), extra = left % 100;
      sum += hundreds * p.p100 + extra * p.p100 / 100;
      var cap = rest >= 500 ? p.kg : p.p500;
      if (sum > cap) sum = cap;
      total += sum;
    }
    return total;
  }
  window.__quote = quote;

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    Object.keys(saved).forEach(function (id) {
      var p = byId[id], g = parseInt(saved[id], 10);
      if (p && g > 0 && g <= p.max) cart[id] = g;
    });
  } catch (e) { cart = {}; }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(cart)); } catch (e) {} }

  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2600);
  }

  var refs = {};
  function lineTotal(id) { return quote(byId[id], cart[id] || 0); }

  function refreshCard(id) {
    var r = refs[id], g = cart[id] || 0;
    if (g > 0) {
      r.incart.style.display = 'block';
      r.info.innerHTML = 'En tu pedido: <b>' + qty(g) + '</b> · <b>' + money(lineTotal(id)) + '</b>';
    } else {
      r.incart.style.display = 'none';
    }
  }
  function refreshSummary() {
    var ids = Object.keys(cart), total = 0;
    ids.forEach(function (id) { total += lineTotal(id); });
    $('summary').textContent = ids.length ? (ids.length + ' artículo(s) · ' + money(total)) : 'Tu pedido está vacío';
    $('send').disabled = !ids.length;
  }
  function change(id, delta) {
    var p = byId[id], now = (cart[id] || 0) + delta;
    if (now > p.max) { toast('Por ahora tenemos disponible hasta ' + qty(p.max) + ' de ' + p.name); return; }
    if (now <= 0) delete cart[id]; else cart[id] = now;
    persist(); refreshCard(id); refreshSummary();
  }
  function remove(id) { delete cart[id]; persist(); refreshCard(id); refreshSummary(); }

  function build() {
    var list = $('list');
    if (!products.length) { list.innerHTML = '<div class="empty">Por ahora no hay productos disponibles. ¡Volvé a consultar pronto!</div>'; return; }
    products.forEach(function (p) {
      var card = document.createElement('div'); card.className = 'card'; card.dataset.name = p.name.toLowerCase();
      var h = document.createElement('h2'); h.textContent = p.name; card.appendChild(h);
      var pr = document.createElement('div'); pr.className = 'prices';
      pr.textContent = money(p.kg) + ' el kg · ' + money(p.p500) + ' los 500 g · ' + money(p.p100) + ' los 100 g';
      card.appendChild(pr);
      var chips = document.createElement('div'); chips.className = 'chips';
      [[100, '+100 g'], [250, '+250 g'], [500, '+500 g'], [1000, '+1 kg']].forEach(function (c) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = c[1];
        b.addEventListener('click', function () { change(p.id, c[0]); });
        chips.appendChild(b);
      });
      card.appendChild(chips);
      var other = document.createElement('div'); other.className = 'other';
      var inp = document.createElement('input'); inp.type = 'number'; inp.min = '1'; inp.step = '50'; inp.placeholder = 'Otra cantidad (g)'; inp.inputMode = 'numeric';
      var add = document.createElement('button'); add.type = 'button'; add.textContent = 'Agregar';
      add.addEventListener('click', function () {
        var g = parseInt(inp.value, 10);
        if (!(g > 0)) { toast('Escribí los gramos que querés'); return; }
        change(p.id, g); inp.value = '';
      });
      other.appendChild(inp); other.appendChild(add); card.appendChild(other);
      var inc = document.createElement('div'); inc.className = 'incart';
      var info = document.createElement('div'); inc.appendChild(info);
      var acts = document.createElement('div'); acts.className = 'acts';
      var minus = document.createElement('button'); minus.type = 'button'; minus.textContent = '− 100 g';
      minus.addEventListener('click', function () { change(p.id, -100); });
      var rm = document.createElement('button'); rm.type = 'button'; rm.className = 'rm'; rm.textContent = 'Quitar';
      rm.addEventListener('click', function () { remove(p.id); });
      acts.appendChild(minus); acts.appendChild(rm); inc.appendChild(acts); card.appendChild(inc);
      list.appendChild(card);
      refs[p.id] = { incart: inc, info: info, card: card };
      refreshCard(p.id);
    });
  }

  $('updated').textContent = DATA.updated ? 'Precios y stock al ' + DATA.updated + '. Te confirmamos el pedido por WhatsApp.' : '';
  $('search').addEventListener('input', function () {
    var q = this.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    products.forEach(function (p) {
      var n = refs[p.id].card.dataset.name;
      refs[p.id].card.style.display = q.every(function (t) { return n.indexOf(t) >= 0; }) ? '' : 'none';
    });
  });

  function orderTotal() { var t = 0; Object.keys(cart).forEach(function (id) { t += lineTotal(id); }); return t; }
  function updateAddr() { $('addrbox').style.display = $('delivery').value === 'envio' ? '' : 'none'; }
  $('delivery').addEventListener('change', updateAddr);
  try {
    var person = JSON.parse(localStorage.getItem(PKEY) || '{}');
    if (person.name) $('name').value = person.name;
    if (person.addr) $('addr').value = person.addr;
  } catch (e) {}
  updateAddr();

  $('send').addEventListener('click', function () {
    var lines = Object.keys(cart).map(function (id) { return byId[id].name + ': ' + qty(cart[id]) + ' · ' + money(lineTotal(id)); });
    $('review').textContent = lines.join('  |  ');
    $('ftotal').textContent = 'Total estimado: ' + money(orderTotal());
    $('overlay').className = 'open';
  });
  $('cancel').addEventListener('click', function () { $('overlay').className = ''; });

  function message() {
    var name = $('name').value.trim(), envio = $('delivery').value === 'envio', addr = $('addr').value.trim(), note = $('note').value.trim();
    var t = '🛒 *Pedido - ' + (DATA.shop || "Natural Clau's") + '*\nCliente: ' + name + '\n';
    t += envio ? ('Entrega: envío sin cargo a ' + addr + '\n') : 'Entrega: retiro en el local\n';
    if (note) t += 'Aclaraciones: ' + note + '\n';
    t += '\n';
    Object.keys(cart).forEach(function (id) { t += '• ' + byId[id].name + ': ' + qty(cart[id]) + ' - ' + money(lineTotal(id)) + '\n'; });
    t += '\n*Total estimado: ' + money(orderTotal()) + '*\n(Los precios y el stock se confirman por WhatsApp)';
    return t;
  }
  window.__message = message;

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var name = $('name').value.trim(), envio = $('delivery').value === 'envio', addr = $('addr').value.trim();
    if (!name) { toast('Escribí tu nombre'); return; }
    if (envio && !addr) { toast('Escribí la dirección de entrega'); return; }
    try { localStorage.setItem(PKEY, JSON.stringify({ name: name, addr: addr })); } catch (e) {}
    var url = 'https://wa.me/' + DATA.whatsapp + '?text=' + encodeURIComponent(message());
    (window.__open || function (u) { window.location.href = u; })(url);
  });

  // Datos de pago: alias con botón para copiarlo (sin abrir ningún enlace) y, si existe, un enlace de pago.
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
        var ok = document.execCommand && document.execCommand('copy'); document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('copy'));
      } catch (e) { reject(e); }
    });
  }
  if (DATA.alias) {
    $('paybox').style.display = 'block';
    $('aliasText').textContent = DATA.alias;
    $('copyAlias').addEventListener('click', function () {
      copyText(DATA.alias).then(function () { toast('Alias copiado: ' + DATA.alias); },
                                function () { toast('Mantené presionado el alias para copiarlo: ' + DATA.alias); });
    });
  }
  if (DATA.payLink && /^https:\/\//i.test(DATA.payLink)) {
    $('paybox').style.display = 'block';
    $('payLink').href = DATA.payLink; $('payLink').style.display = 'inline-block';
  }

  build(); refreshSummary();
})();
</script>
</body>
</html>
